<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김분홍 방명록</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --hot: #ff1493;
    --hot-deep: #d6006f;
    --hot-darker: #a8005a;
    --hot-light: #ff85c2;
    --hot-tint: #ffe0f0;
    --ink: #2b0619;
    --error-bg: #ffffff;
    --error: #a3003f;
    --canvas: #ffffff;
    --shadow: rgba(80,0,40,0.10) 0 0 0 1px, rgba(80,0,40,0.14) 0 2px 6px 0, rgba(80,0,40,0.22) 0 4px 8px 0;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--hot); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--hot);
    color: var(--ink);
    font-family: 'Airbnb Cereal VF', Circular, -apple-system, system-ui, Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

  header { padding: 32px 0 24px; border-bottom: 2px solid #fff; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.43; color: #fff; }
  .sub { margin: 4px 0 0; font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.43; }
  .dot { color: var(--ink); }

  form {
    display: flex; flex-direction: column; gap: 12px;
    padding: 24px; background: var(--hot-deep);
    border-radius: 14px; box-shadow: var(--shadow);
  }
  label { display: block; font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  input {
    width: 100%; height: 56px; padding: 14px 12px;
    font: inherit; color: var(--ink); background: var(--canvas);
    border: 1px solid transparent; border-radius: 8px; outline: none;
  }
  input::placeholder { color: #8a4a68; }
  input:focus { border: 2px solid var(--ink); padding: 13px 11px; }
  button {
    height: 48px; padding: 14px 24px; margin-top: 4px;
    font: inherit; font-weight: 700; color: var(--hot-darker);
    background: #fff; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:active { background: var(--hot-tint); }
  button:disabled { background: var(--hot-light); color: var(--hot-darker); cursor: not-allowed; }
  #status:not(:empty) { display: inline-block; margin: 8px 0 0; padding: 4px 10px; border-radius: 8px; background: var(--error-bg); }
  #status { min-height: 21px; font-size: 14px; font-weight: 600; color: var(--error); }

  .list-head { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 12px; }
  .list-head h2 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; letter-spacing: -0.18px; color: #fff; }
  #count { font-size: 14px; font-weight: 600; color: var(--ink); }

  #list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .card { padding: 16px; border-radius: 14px; background: var(--canvas); border-left: 6px solid var(--hot-deep); box-shadow: var(--shadow); }
  .card:nth-child(even) { background: var(--hot-tint); border-left-color: var(--hot-darker); }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .name { font-size: 16px; font-weight: 700; line-height: 1.25; color: var(--hot-darker); overflow-wrap: anywhere; }
  .time { flex: none; font-size: 13px; color: #7a3a58; }
  .msg { margin: 8px 0 0; font-size: 16px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { padding: 32px 16px; text-align: center; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--hot-tint); border-radius: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>김분홍 방명록<span class="dot">.</span></h1>
    <p class="sub">이름과 분홍에게 하고 싶은 말을 남겨 주세요</p>
  </header>

  <form id="form" novalidate>
    <div>
      <label for="name">이름</label>
      <input id="name" placeholder="이름" maxlength="30" autocomplete="off">
    </div>
    <div>
      <label for="message">분홍에게 말하기</label>
      <input id="message" placeholder="분홍에게 말하기" maxlength="200" autocomplete="off">
    </div>
    <button type="submit" id="submit">남기기</button>
  </form>
  <p id="status" role="status"></p>

  <div class="list-head">
    <h2>남긴 글</h2>
    <span id="count"></span>
  </div>
  <ul id="list"></ul>
</div>

<script>
const SUPABASE_URL = 'https://rulmxkehqyauofgsxjlu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AFXkwvb4FwoEVgH3AffCgg_2DAP6U81';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById('form');
const nameInput = document.getElementById('name');
const messageInput = document.getElementById('message');
const submitBtn = document.getElementById('submit');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count');
const list = document.getElementById('list');

function makeCard(row) {
  const li = document.createElement('li');
  li.className = 'card';

  const top = document.createElement('div');
  top.className = 'card-top';
  const name = document.createElement('span');
  name.className = 'name';
  const time = document.createElement('span');
  time.className = 'time';
  // textContent: 입력한 내용을 HTML로 해석하지 않고 글자 그대로 표시
  name.textContent = row.name;
  time.textContent = new Date(row.created_at).toLocaleString('ko-KR', {
    month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit'
  });
  top.append(name, time);

  const msg = document.createElement('p');
  msg.className = 'msg';
  msg.textContent = row.message;

  li.append(top, msg);
  return li;
}

async function loadList() {
  const { data, error } = await db
    .from('guestbook')
    .select('name, message, created_at')
    .order('created_at', { ascending: false });
  if (error) {
    statusEl.textContent = '목록을 불러오지 못했어요: ' + error.message;
    return;
  }
  list.replaceChildren();
  countEl.textContent = data.length ? data.length + '개' : '';
  if (!data.length) {
    const empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = '아직 남긴 글이 없어요. 첫 인사를 남겨 보세요!';
    list.appendChild(empty);
    return;
  }
  for (const row of data) list.appendChild(makeCard(row));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = nameInput.value.trim();
  const message = messageInput.value.trim();
  if (!name || !message) {
    statusEl.textContent = '이름과 글을 모두 입력해 주세요.';
    return;
  }
  submitBtn.disabled = true;
  const { error } = await db.from('guestbook').insert({ name, message });
  submitBtn.disabled = false;
  if (error) {
    statusEl.textContent = '저장하지 못했어요: ' + error.message;
    return;
  }
  statusEl.textContent = '';
  messageInput.value = '';
  await loadList();
});

loadList();
</script>
</body>
</html>
